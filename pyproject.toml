[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainbow-energy-publisher"
version = "0.1.0"
description = "Publish inverter measurements to MQTT for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Rainbow Solar" },
]
dependencies = [
  "paho-mqtt>=2.1.0",
  "pyyaml>=6.0.3",
  "rainbow-energy-modbus-client",
]

[project.scripts]
rainbow-energy-publisher = "rainbow_energy_publisher.cli:main"

[project.urls]
Homepage = "https://github.com/rainbow-energy/rainbow-energy-publisher"
Repository = "https://github.com/rainbow-energy/rainbow-energy-publisher"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
]

[tool.uv.sources]
# Requires `rainbow-energy-modbus-client` on main (not legacy `rainbow-energy-client`).
rainbow-energy-modbus-client = { git = "https://github.com/rainbow-energy/rainbow-energy-modbus-client.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/rainbow_energy_publisher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=rainbow_energy_publisher",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
