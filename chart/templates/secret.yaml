{{- if and (not .Values.mqtt.existingSecret) (or .Values.mqtt.username .Values.mqtt.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rainbow-energy-publisher.fullname" . }}-mqtt
  labels:
    {{- include "rainbow-energy-publisher.labels" . | nindent 4 }}
type: Opaque
stringData:
  MQTT_USERNAME: {{ .Values.mqtt.username | quote }}
  MQTT_PASSWORD: {{ .Values.mqtt.password | quote }}
{{- end }}
