[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rainbow-energy-mqtt"
version = "0.1.0"
description = "Publish inverter measurements to MQTT for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
  { name = "Rainbow Solar" },
]
dependencies = [
  "pyyaml>=6.0.3",
]

[project.scripts]
rainbow-energy-mqtt = "rainbow_energy_mqtt.cli:main"

[project.urls]
Homepage = "https://github.com/rainbow-solar/rainbow-energy-mqtt"
Repository = "https://github.com/rainbow-solar/rainbow-energy-mqtt"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rainbow_energy_mqtt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=rainbow_energy_mqtt",
  "--cov-report=term-missing",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
